<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد أشرورو | الموقع الرسمي</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        pam: {
                            blue: '#1d4ed8',
                            light: '#eff6ff',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body{
            font-family:'Cairo',sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-pam-light to-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100 relative">

    <!-- الشريط العلوي -->
    <div class="absolute top-0 left-0 w-full h-3 bg-pam-blue"></div>

    <div class="p-10 md:p-16 text-center">

        <!-- الصورة -->
        <div class="mb-8">
            <div class="w-28 h-28 mx-auto rounded-full overflow-hidden border-4 border-pam-light shadow-md">
                <img
                    src="https://raw.githubusercontent.com/eliteducs-coder/chrourou/refs/heads/main/chrourou.png"
                    alt="محمد أشرورو"
                    class="w-full h-full object-cover">
            </div>

            <h2 class="mt-5 text-3xl font-extrabold text-blue-900">
                محمد أشرورو
            </h2>

            <p class="text-gray-500 mt-2">
                الموقع الرسمي
            </p>
        </div>

        <!-- العنوان -->

        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 leading-tight">
            الموقع
            <span class="text-pam-blue">
                قيد الإنجاز
            </span>
        </h1>

        <!-- الوصف -->

        <p class="mt-6 text-lg text-gray-600 leading-9">
            نعمل حالياً على إعداد الموقع الرسمي للسيد
            <strong class="text-gray-800">
                محمد أشرورو
            </strong>.
        </p>

        <!-- مؤثر التحميل -->

        <div class="flex justify-center mt-10 gap-2">

            <div class="w-3 h-3 rounded-full bg-pam-blue animate-bounce"></div>

            <div class="w-3 h-3 rounded-full bg-blue-400 animate-bounce"
                 style="animation-delay:.15s"></div>

            <div class="w-3 h-3 rounded-full bg-blue-200 animate-bounce"
                 style="animation-delay:.30s"></div>

        </div>

        <!-- اسم النطاق -->

        <div class="mt-10">

            <span class="inline-block bg-pam-light text-pam-blue border border-blue-100 rounded-full px-8 py-3 text-lg font-bold tracking-wider"
                  dir="ltr">

                www.chrourou.ma

            </span>

        </div>

        <!-- وسائل التواصل -->

        <div class="border-t border-gray-100 mt-10 pt-8">

            <div class="flex justify-center gap-4">

                <a href="#" class="w-12 h-12 rounded-full bg-gray-100 hover:bg-pam-blue hover:text-white text-gray-400 transition flex items-center justify-center">
                    <i class="fab fa-facebook-f"></i>
                </a>

                <a href="#" class="w-12 h-12 rounded-full bg-gray-100 hover:bg-pam-blue hover:text-white text-gray-400 transition flex items-center justify-center">
                    <i class="fab fa-instagram"></i>
                </a>

                <a href="#" class="w-12 h-12 rounded-full bg-gray-100 hover:bg-pam-blue hover:text-white text-gray-400 transition flex items-center justify-center">
                    <i class="fab fa-tiktok"></i>
                </a>

                <a href="#" class="w-12 h-12 rounded-full bg-gray-100 hover:bg-pam-blue hover:text-white text-gray-400 transition flex items-center justify-center">
                    <i class="fab fa-youtube"></i>
                </a>

            </div>

        </div>

    </div>

</div>

<!-- التذييل -->

<footer class="mt-8 text-center text-gray-400 text-sm">

    &copy; 2026 جميع الحقوق محفوظة

</footer>

</body>
</html>
