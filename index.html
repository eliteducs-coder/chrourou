<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد شرورو | الموقع الرسمي</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        pam: {
                            blue: '#1d4ed8',
                            light: '#eff6ff',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body{
            font-family:'Cairo',sans-serif;
            background-color: #f4f6f9;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

<div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden relative mb-12">

    <!-- الشريط العلوي -->
    <div class="absolute top-0 left-0 w-full h-3 bg-pam-blue"></div>

    <div class="p-10 md:p-14 text-center">

        <!-- الصورة -->
        <div class="mb-6">
            <div class="w-24 h-24 mx-auto rounded-full overflow-hidden border-4 border-pam-light shadow-sm bg-blue-50">
                <img
                    src="https://raw.githubusercontent.com/eliteducs-coder/chrourou/refs/heads/main/chrourou.png"
                    alt="محمد شرورو"
                    class="w-full h-full object-cover">
            </div>

            <h2 class="mt-4 text-2xl font-extrabold text-blue-900">
                محمد شرورو
            </h2>

            <p class="text-gray-400 text-sm mt-1 font-semibold">
                الموقع الرسمي
            </p>
        </div>

        <!-- العنوان -->
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 leading-tight mt-6">
            الموقع
            <span class="text-pam-blue">قيد</span>
            الإنجاز
        </h1>

        <!-- الوصف -->
        <p class="mt-5 text-gray-500 leading-relaxed font-medium">
            نعمل حالياً على إعداد الموقع الرسمي للسيد
            <strong class="text-gray-800 font-bold">
                محمد شرورو
            </strong>.
        </p>

        <!-- مؤثر التحميل -->
        <div class="flex justify-center mt-8 gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-pam-blue animate-pulse"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse" style="animation-delay:.15s"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-blue-300 animate-pulse" style="animation-delay:.30s"></div>
        </div>

        <!-- اسم النطاق -->
        <div class="mt-10">
            <span class="inline-block bg-blue-50 text-pam-blue rounded-full px-8 py-3 text-sm font-bold tracking-wider"
                  dir="ltr">
                www.chrourou.ma
            </span>
        </div>

        <!-- وسائل التواصل -->
        <div class="border-t border-gray-100 mt-10 pt-8">
            <div class="flex justify-center gap-4 text-gray-400">
                <a href="#" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-pam-blue hover:text-white transition-colors flex items-center justify-center">
                    <i class="fab fa-facebook-f text-sm"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-pam-blue hover:text-white transition-colors flex items-center justify-center">
                    <i class="fab fa-instagram text-sm"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-pam-blue hover:text-white transition-colors flex items-center justify-center">
                    <i class="fab fa-tiktok text-sm"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-full bg-gray-50 hover:bg-pam-blue hover:text-white transition-colors flex items-center justify-center">
                    <i class="fab fa-youtube text-sm"></i>
                </a>
            </div>
        </div>

    </div>

</div>

<!-- التذييل في الأسفل دائماً -->
<footer class="absolute bottom-4 w-full text-center text-gray-400 text-xs font-medium">
    &copy; 2026 جميع الحقوق محفوظة
</footer>

</body>
</html>
